<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar Khayyam Cafe</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;

    background:
        linear-gradient(rgba(20,12,8,.45), rgba(20,12,8,.45)),
        url("background.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}
h1{
    background:transparent;
    color:#e8c86d;
    padding:35px 20px;
    margin:0;
    font-size:48px;
    text-shadow:2px 2px 12px rgba(0,0,0,.8);
}

.gallery{
    padding:20px;
    background:rgba(0,0,0,0.25);
    margin:20px;
    border-radius:20px;
}
  .gallery img{
    width:90%;
    max-width:600px;
    border-radius:20px;
    margin:20px auto;
    display:block;
    border:3px solid rgba(212,175,55,.6);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }  





button{
    background:linear-gradient(to bottom,#b68b3a,#7a5524);
    color:white;
    border:2px solid #d4af37;
    padding:14px 28px;
    font-size:22px;
    border-radius:15px;
    margin:10px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

button:hover{
    background:linear-gradient(to bottom,#d4af37,#8b5e2b);
    transform:scale(1.08);
}

</style>

</head>


<body>


<h1>☕ عمر الخيام كافيه</h1>


<div class="gallery">

<img id="menuImage" src="m1.png" alt="Menu">


<button onclick="prevImage()">⬅️</button>

<button onclick="nextImage()">➡️</button>


</div>



<script>

let images = [
"m1.png",
"m2.png",
"m3.png",
"m4.png",
"m5.png",
"m6.png",
"m7.png",
"m8.png",
"m9.png",
"m10.png",
"m11.png"
];


let current = 0;


let img = document.getElementById("menuImage");


function nextImage(){

    current++;

    if(current >= images.length){
        current = 0;
    }

    img.src = images[current];

}



function prevImage(){

    current--;

    if(current < 0){
        current = images.length - 1;
    }

    img.src = images[current];

}


</script>


</body>

</html>

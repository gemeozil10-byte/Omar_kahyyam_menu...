<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar Khayyam Cafe</title>

<style>

body{
    margin:0;
    background:#f5f1ea;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    background:#4a2c1d;
    color:white;
    padding:20px;
    margin:0;
}

.gallery{
    padding:20px;
}

.gallery img{
    width:90%;
    max-width:600px;
    border-radius:15px;
    margin:20px auto;
    display:block;
}

button{
    background:#4a2c1d;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:20px;
    border-radius:10px;
    margin:10px;
    cursor:pointer;
}

button:hover{
    background:#6b4028;
}

</style>

</head>


<body>


<h1>☕ عمر الخيام كافيه</h1>


<div class="gallery">

<img id="menuImage" src="m1.png" alt="Menu">


<button onclick="prevImage()">⬅️</button>

<button onclick="nextImage()">➡️</button>


</div>



<script>

let images = [
"m1.png",
"m2.png",
"m3.png",
"m4.png",
"m5.png",
"m6.png",
"m7.png",
"m8.png",
"m9.png",
"m10.png",
"m11.png"
];


let current = 0;


let img = document.getElementById("menuImage");


function nextImage(){

    current++;

    if(current >= images.length){
        current = 0;
    }

    img.src = images[current];

}



function prevImage(){

    current--;

    if(current < 0){
        current = images.length - 1;
    }

    img.src = images[current];

}


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omar Khayyam Cafe</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;

    background:
        linear-gradient(rgba(20,12,8,.45), rgba(20,12,8,.45)),
        url("background.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}.logo{
    text-align:center;
    margin-top:35px;
    margin-bottom:20px;
    line-height:1.5;
}

.logo .arabic{
    display:block;
    font-size:58px;
    font-weight:bold;
    color:#e3c26a;
    text-shadow:
        0 0 10px rgba(0,0,0,.8),
        0 0 20px rgba(212,175,55,.3);
}

.logo .english{
    display:block;
    font-size:18px;
    color:#f5e6b8;
    letter-spacing:5px;
    margin-top:8px;
}

.logo .ornament{
    display:block;
    color:#d4af37;
    font-size:24px;
    letter-spacing:10px;
}

.gallery{
    width:95%;
    max-width:1100px;
    margin:30px auto;
    padding:25px;
    background:rgba(0,0,0,.25);
    border-radius:20px;
}
.gallery img{
    width:98%;
    max-width:900px;
    border-radius:20px;
    margin:20px auto;
    display:block;
    border:3px solid rgba(212,175,55,.6);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

button{
    background:linear-gradient(to bottom,#b68b3a,#7a5524);
    color:white;
    border:2px solid #d4af37;
    padding:14px 28px;
    font-size:22px;
    border-radius:15px;
    margin:10px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

button:hover{
    background:linear-gradient(to bottom,#d4af37,#8b5e2b);
    transform:scale(1.08);
}

</style>

</head>


<body>

<h1 class="logo">
    <span class="ornament">❁ ✦ ❁</span><br>

    <span class="arabic">
        عُمَرُ الخَيّام
    </span><br>

    <span class="english">
        OMAR KHAYYAM CAFE
    </span><br>

    <span class="ornament">❁ ✦ ❁</span>
</h1>


<div class="gallery">

<img id="menuImage" src="m1.png" alt="Menu">

<button onclick="prevImage()">⬅️</button>

<button onclick="nextImage()">➡️</button>

</div>

<script>

let images = [
"m1.png",
"m2.png",
"m3.png",
"m4.png",
"m5.png",
"m6.png",
"m7.png",
"m8.png",
"m9.jpg",
"m10.jpg",
"m11.jpg"
];

let current = 0;

function showImage() {
    document.getElementById("menuImage").src = images[current];
}

function nextImage() {
    current = (current + 1) % images.length;
    showImage();
}

function prevImage() {
    current = (current - 1 + images.length) % images.length;
    showImage();
}

</script>

</body>

</html>
